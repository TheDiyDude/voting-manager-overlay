<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Randvieh Poll Overlay - Neon Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap');

  body {
    margin: 0;
    padding: 20px;
    background: transparent;
    font-family: 'Nunito', sans-serif;
    color: #ffffff;
    user-select: none;
    overflow: hidden;
  }

  #poll-container {
    width: 520px;
    background: linear-gradient(180deg, rgba(12, 16, 40, 0.95) 0%, rgba(8, 10, 24, 0.98) 100%);
    border: 2px solid #232b57;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(0, 210, 255, 0.2);
    display: none;
    opacity: 0;
    transition: opacity 0.4s ease-in-out;
  }

  /* Header Bereich */
  #poll-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  }

  .poll-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: transparent;
    border: 2px solid #e900ff;
    border-radius: 6px;
    color: #e900ff;
    box-shadow: 0 0 8px rgba(233, 0, 255, 0.5), inset 0 0 8px rgba(233, 0, 255, 0.3);
  }

  #timer-box {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    font-weight: 900;
    color: #e900ff;
    border: 2px solid #e900ff;
    border-radius: 20px;
    padding: 4px 14px;
    box-shadow: 0 0 8px rgba(233, 0, 255, 0.5), inset 0 0 8px rgba(233, 0, 255, 0.3);
    text-shadow: 0 0 8px rgba(233, 0, 255, 0.8);
  }

  #poll-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 20px;
    line-height: 1.3;
    color: #ffffff;
  }

  /* Optionen Liste */
  #poll-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-row {
    display: flex;
    align-items: center;
    background: #111732;
    border: 1px solid #232b57;
    border-radius: 8px;
    padding: 10px 15px 10px 5px;
    transition: all 0.3s ease;
  }

  /* Highlight-Klasse für die führende Option */
  .option-row.leading {
    border-color: var(--theme-color);
    box-shadow: 0 0 10px rgba(var(--theme-color-rgb), 0.4), inset 0 0 10px rgba(var(--theme-color-rgb), 0.2);
  }

  .crown-container {
    width: 30px;
    text-align: center;
    font-size: 20px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 5px #ffaa00);
  }

  .option-number {
    width: 32px;
    height: 32px;
    background: var(--theme-color);
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 18px;
    font-weight: 900;
    color: #ffffff;
    margin-right: 15px;
    flex-shrink: 0;
    box-shadow: 0 0 8px var(--theme-color);
  }

  .option-content {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow: hidden;
  }

  .option-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .option-label {
    font-size: 16px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .option-stats {
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #d0d5ea;
  }

  .percent-text {
    width: 45px;
    text-align: right;
  }

  .bar-bg {
    width: 100%;
    height: 8px;
    background: #1a2245;
    border-radius: 4px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    background: var(--theme-color);
    border-radius: 4px;
    transition: width 0.4s ease;
    box-shadow: 0 0 8px var(--theme-color);
  }

  /* Footer Tipp */
  #footer-tip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
    padding: 10px;
    background: #0b0e22;
    border: 1px solid #232b57;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #a0a8cc;
  }

  .highlight {
    color: #e900ff;
  }

  .chat-icon {
    color: #8a2be2;
    display: flex;
    align-items: center;
  }

  #winner-banner {
    display: none;
    text-align: center;
    padding: 12px;
    margin-top: 15px;
    background: #e900ff;
    color: #ffffff;
    font-weight: 900;
    font-size: 16px;
    border-radius: 8px;
    box-shadow: 0 0 15px #e900ff;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div id="poll-container">
  <div id="poll-header">
    <div class="header-left">
      <div class="poll-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="14" width="4" height="7" rx="1"/>
          <rect x="10" y="8" width="4" height="13" rx="1"/>
          <rect x="17" y="3" width="4" height="18" rx="1"/>
        </svg>
      </div>
      LIVE POLL
    </div>
    <div id="timer-box">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="13" r="8"></circle>
        <polyline points="12 9 12 13 14 15"></polyline>
        <line x1="10" y1="3" x2="14" y2="3"></line>
      </svg>
      <span id="poll-timer">00:00</span>
    </div>
  </div>
  
  <div id="poll-title">POLL TITLE</div>
  
  <div id="poll-options"></div>
  
  <div id="footer-tip">
    <div class="chat-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 9H6V9h12v2zm0-3H6V6h12v2z"/>
      </svg>
    </div>
    <span>&gt;&gt;&gt; Tipp: Schreibe einfach die <span class="highlight">Optionsnummer</span> in den <span class="highlight">Chat!</span> (1-4) &lt;&lt;&lt;</span>
  </div>

  <div id="winner-banner">WINNER: OPTION 1</div>
</div>

<script>
  let remainingSeconds = 0;
  let lastStatus = "";
  let hideTimeout = null;

  // Farben-Array für die Optionen (Magenta, Cyan, Lila, Grün)
  const themeColors = ['#e900ff', '#00d2ff', '#7038ff', '#00ff78', '#ffaa00', '#ff0055'];

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text;
    return div.innerHTML;
  }

  async function updatePoll() {
    try {
      const response = await fetch('poll_data.json?v=' + Date.now());
      if (!response.ok) return;
      const data = await response.json();
      handlePollUpdate(data);
    } catch (e) {}
  }

  function handlePollUpdate(data) {
    const container = document.getElementById("poll-container");
    const banner = document.getElementById("winner-banner");
    const footerTip = document.getElementById("footer-tip");

    if (data.status === "idle") {
      container.style.opacity = "0";
      container.style.display = "none";
      banner.style.display = "none";
      return;
    }

    if (data.status === "prepared" || data.status === "active" || data.status === "paused") {
      if (hideTimeout) {
        clearTimeout(hideTimeout);
        hideTimeout = null;
      }
      banner.style.display = "none";
      footerTip.style.display = "flex";
      container.style.display = "block";
      container.style.opacity = "1";

      document.getElementById("poll-title").innerText = data.title;
      remainingSeconds = data.remainingSeconds;

      if (data.status === "paused") {
        document.getElementById("poll-timer").innerText = "PAUSE";
      } else {
        updateTimerDisplay();
      }

      renderOptions(data.options, data.votes, data.totalVotes);
    } else if (data.status === "ended") {
      footerTip.style.display = "none";
      renderOptions(data.options, data.votes, data.totalVotes);
      document.getElementById("poll-timer").innerText = "00:00";

      if (data.winner) {
        banner.innerText = "GEWINNER: " + data.winner;
        banner.style.display = "block";
      }

      if (lastStatus !== "ended" && !hideTimeout) {
        hideTimeout = setTimeout(() => {
          container.style.opacity = "0";
          setTimeout(() => { container.style.display = "none"; }, 500);
        }, 60000);
      }
    }
    lastStatus = data.status;
  }

  function updateTimerDisplay() {
    const m = Math.floor(remainingSeconds / 60).toString().padStart(2, '0');
    const s = (remainingSeconds % 60).toString().padStart(2, '0');
    document.getElementById("poll-timer").innerText = `${m}:${s}`;
  }

  function renderOptions(options, votes, totalVotes) {
    const list = document.getElementById("poll-options");
    list.innerHTML = "";

    // Höchste Stimmenanzahl ermitteln (für die Krone)
    let maxVotes = -1;
    if (totalVotes > 0) {
      maxVotes = Math.max(...votes);
    }

    options.forEach((opt, idx) => {
      const voteCount = votes[idx] || 0;
      const pct = totalVotes > 0 ? Math.round((voteCount / totalVotes) * 100) : 0;
      const color = themeColors[idx % themeColors.length];
      const isLeading = totalVotes > 0 && voteCount === maxVotes && maxVotes > 0;

      const row = document.createElement("div");
      row.className = `option-row ${isLeading ? 'leading' : ''}`;
      row.style.setProperty('--theme-color', color);
      
      // Kleiner Trick für das Box-Shadow-Glow in CSS
      const hex = color.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      row.style.setProperty('--theme-color-rgb', `${r}, ${g}, ${b}`);

      row.innerHTML = `
        <div class="crown-container">${isLeading ? '👑' : ''}</div>
        <div class="option-number">${idx + 1}</div>
        <div class="option-content">
          <div class="option-top">
            <span class="option-label">${escapeHtml(opt)}</span>
            <span class="option-stats">
              ${voteCount} 
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg> 
              <span class="percent-text">(${pct}%)</span>
            </span>
          </div>
          <div class="bar-bg">
            <div class="bar-fill" style="width: ${pct}%"></div>
          </div>
        </div>
      `;
      list.appendChild(row);
    });
  }

  setInterval(updatePoll, 300);
  updatePoll();
</script>
</body>
</html>
